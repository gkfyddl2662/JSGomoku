name: Libriichi Python Package CI

on:
  push:
    branches:
      - research/mortal-rogs-v4-impl
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_MORTAL_SHA: 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2

jobs:
  python-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone pinned canonical Mortal
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/mortal-libriichi-package
          git -C /tmp/mortal-libriichi-package checkout "$CANONICAL_MORTAL_SHA"

      - name: Apply complete unified production patches
        run: |
          python scripts/patch_mortal_unified_all.py --root /tmp/mortal-libriichi-package
          grep -q 'module-name = "libriichi"' /tmp/mortal-libriichi-package/libriichi/pyproject.toml
          grep -q 'UNIFIED_GAMEPLAY_ABI' /tmp/mortal-libriichi-package/libriichi/src/dataset/mod.rs
          grep -q 'fn libriichi(' /tmp/mortal-libriichi-package/libriichi/src/lib.rs
          ! grep -R --include='*.py' -n 'from libriichi\.' /tmp/mortal-libriichi-package/mortal

      - name: Build extension with maturin in bootstrap-style venv
        run: |
          python -m venv /tmp/mortal-libriichi-package/.venv
          /tmp/mortal-libriichi-package/.venv/bin/python -m pip install --upgrade pip maturin numpy toml
          /tmp/mortal-libriichi-package/.venv/bin/python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          cd /tmp/mortal-libriichi-package/libriichi
          /tmp/mortal-libriichi-package/.venv/bin/python -m maturin develop --release

      - name: Import unified Python extension
        run: |
          /tmp/mortal-libriichi-package/.venv/bin/python - <<'PY'
          import libriichi
          from libriichi import consts, arena, dataset, stat, mjai
          assert consts.MAX_VERSION == 4
          assert consts.action_space_for('3p') == 44
          assert consts.action_space_for('4p') == 46
          assert consts.obs_shape_for('3p', 4) == (1010, 34)
          assert consts.obs_shape_for('4p', 4) == (1012, 34)
          assert hasattr(arena, 'OneVsTwo') and hasattr(arena, 'OneVsThree')
          assert hasattr(dataset, 'GameplayLoader')
          assert dataset.UNIFIED_GAMEPLAY_ABI == 2
          print('LIBRIICHI_PYTHON_IMPORT_OK', libriichi.__file__)
          print('LIBRIICHI_GAMEPLAY_ABI_OK', dataset.UNIFIED_GAMEPLAY_ABI)
          PY

      - name: Run real CPU 3P and 4P gameplay log roundtrip
        env:
          PYTHONPATH: /tmp/mortal-libriichi-package/mortal
        run: |
          /tmp/mortal-libriichi-package/.venv/bin/python scripts/smoke_unified_gameplay.py \
            --runtime-root /tmp/mortal-libriichi-package \
            --device cpu

      - name: Run strict checkpoint and evaluator E2E
        env:
          PYTHONPATH: /tmp/mortal-libriichi-package/mortal
        run: |
          /tmp/mortal-libriichi-package/.venv/bin/python scripts/smoke_unified_evaluator.py \
            --runtime-root /tmp/mortal-libriichi-package \
            --device cpu
