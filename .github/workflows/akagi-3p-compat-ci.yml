name: Akagi 3P Compatibility CI

on:
  push:
    branches:
      - research/mortal-rogs-v4-impl
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-libriichi3p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run compatibility source tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_akagi_3p_compat.py tests/test_akagi_legacy_event_adapter.py
      - name: Execute population compatibility wrapper directly
        run: |
          python scripts/prepare_selfplay_population_compat.py --help
      - name: Compile compatibility helpers
        run: |
          python -m py_compile scripts/akagi_3p_compat.py scripts/prepare_selfplay_population_compat.py scripts/patch_mortal_akagi_legacy_events.py
      - name: Clone pinned Akagi-NG
        run: |
          git clone --no-checkout https://github.com/Xe-Persistent/Akagi-NG.git /tmp/akagi-ng
          git -C /tmp/akagi-ng fetch --depth 1 origin 11c0ffc0d70bf8142585b92405b4412976c9e205
          git -C /tmp/akagi-ng checkout --detach --force 11c0ffc0d70bf8142585b92405b4412976c9e205
          test "$(git -C /tmp/akagi-ng rev-parse HEAD)" = "11c0ffc0d70bf8142585b92405b4412976c9e205"
      - name: Import pinned 3P encoder contract
        run: |
          mkdir -p /tmp/akagi-compat-lib
          cp /tmp/akagi-ng/lib/libriichi3p-3.12-x86_64-unknown-linux-gnu.so /tmp/akagi-compat-lib/libriichi3p.so
          PYTHONPATH=/tmp/akagi-compat-lib python - <<'PY'
          import libriichi3p

          assert tuple(libriichi3p.consts.obs_shape(4)) == (775, 34), libriichi3p.consts.obs_shape(4)
          assert int(libriichi3p.consts.ACTION_SPACE) == 44, libriichi3p.consts.ACTION_SPACE
          assert hasattr(libriichi3p, 'mjai')
          assert hasattr(libriichi3p.mjai, 'Bot')
          print('AKAGI_PINNED_LIBRIICHI3P_CONTRACT_OK obs=775 actions=44 mjai=Bot')
          PY
      - name: Verify pinned Akagi sanma MJAI container contract
        run: |
          bridge=/tmp/akagi-ng/akagi_backend/akagi_ng/bridge/majsoul/bridge.py
          grep -Fq 'scores = [*scores, 0]' "$bridge"
          grep -Fq 'MahjongConstants.SEATS_4P' "$bridge"
          grep -Fq 'tehais[self.seat] = list(sorted_tehais)' "$bridge"
          echo 'AKAGI_PINNED_SANMA_MJAI_CONTRACT_OK slots=4 hidden-info=masked'
      - name: Verify unified OneVsTwo source contract
        run: |
          grep -q 'm.add_class::<OneVsTwo>()?;' scripts/patch_libriichi_unified_game_stage5b.py
          grep -q 'maturin develop --release' scripts/rebuild_unified_libriichi.ps1
