name: Research CI

on:
  push:
    branches:
      - research/mortal-rogs-v4-impl
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest numpy
      - name: Compile Python sources
        run: python -m compileall -q app evaluation training scripts tests
      - name: Core tests
        run: |
          python -m pytest -q \
            tests/test_configuration.py \
            tests/test_dual_runtime.py \
            tests/test_rating.py \
            tests/test_evaluation_backends.py \
            tests/test_evaluation_gating.py \
            tests/test_paired_promotion.py
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('scripts/bootstrap.ps1', 'scripts/bootstrap_runtime.ps1', 'scripts/smoke_windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $path"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  torch-objective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: ROGS tensor tests
        run: |
          python -m pytest -q \
            tests/test_rogs.py \
            tests/test_objective.py \
            tests/test_mortal_hook.py

  mortal-sanma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone Mortal Sanma upstream
        run: git clone --depth 1 https://github.com/Lawrencelea/Mortal_Sanma.git /tmp/mortal-sanma
      - name: Apply RTX 5080 and ROGS patch pipeline
        run: python scripts/patch_mortal_all.py --root /tmp/mortal-sanma
      - name: Compile patched trainer
        run: |
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/train.py
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/train_grp.py
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/model.py
      - name: Verify ROGS hook postconditions
        run: |
          grep -q "compute_mortal_rogs_batch" /tmp/mortal-sanma/Mortal/mortal/train.py
          grep -q "enable_behavior_cloning=not online" /tmp/mortal-sanma/Mortal/mortal/train.py
          grep -q "loss/rogs_total" /tmp/mortal-sanma/Mortal/mortal/train.py
          git -C /tmp/mortal-sanma diff --check

  mortal-yonma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone stock Mortal 4P upstream
        run: git clone --depth 1 https://github.com/Equim-chan/Mortal.git /tmp/mortal-4p
      - name: Apply RTX 5080 and ROGS patch pipeline
        run: python scripts/patch_mortal_4p.py --root /tmp/mortal-4p
      - name: Compile patched 4P trainer
        run: |
          python -m py_compile /tmp/mortal-4p/mortal/train.py
          python -m py_compile /tmp/mortal-4p/mortal/train_grp.py
          python -m py_compile /tmp/mortal-4p/mortal/model.py
      - name: Verify 4P ABI and ROGS postconditions
        run: |
          grep -q "compute_mortal_rogs_batch" /tmp/mortal-4p/mortal/train.py
          grep -q "enable_behavior_cloning=not online" /tmp/mortal-4p/mortal/train.py
          grep -q "loss/rogs_total" /tmp/mortal-4p/mortal/train.py
          grep -q "version = config\['control'\]\['version'\]" /tmp/mortal-4p/mortal/train.py
          git -C /tmp/mortal-4p diff --check

  mjx-sanma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone pinned MJX
        run: |
          git clone --branch v0.1.0 --depth 1 https://github.com/mjx-project/mjx.git /tmp/mjx-sanma
          git -C /tmp/mjx-sanma submodule update --init --recursive
      - name: Verify pinned source
        run: |
          python scripts/audit_mjx_sanma.py \
            --root /tmp/mjx-sanma \
            --allow-blockers
      - name: Apply sanma stages 1-4
        run: python scripts/patch_mjx_sanma.py --root /tmp/mjx-sanma --through 4
      - name: Verify Stage 4 state/scoring postconditions
        run: |
          grep -q "RuleConfig rule_" /tmp/mjx-sanma/include/mjx/internal/state.h
          grep -q "rule_.rounds_per_wind" /tmp/mjx-sanma/include/mjx/internal/state.cpp
          grep -q "rule_.return_points" /tmp/mjx-sanma/include/mjx/internal/state.cpp
          grep -q "num_players - 2" /tmp/mjx-sanma/include/mjx/internal/win_score.cpp
          grep -q "rule.tsumo_loss = true" /tmp/mjx-sanma/include/mjx/internal/rule.h
      - name: Reject whitespace-damaged C++ patch
        run: git -C /tmp/mjx-sanma diff --check
      - name: Show residual four-player blockers
        run: |
          python scripts/audit_mjx_sanma.py \
            --root /tmp/mjx-sanma \
            --allow-changed \
            --allow-blockers
