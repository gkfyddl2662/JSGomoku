name: Research CI

on:
  push:
    branches:
      - research/mortal-rogs-v4-impl
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest numpy
      - name: Compile Python sources
        run: python -m compileall -q app evaluation training scripts tests
      - name: Core tests
        run: |
          python -m pytest -q \
            tests/test_configuration.py \
            tests/test_dual_runtime.py \
            tests/test_game_mode.py \
            tests/test_rating.py \
            tests/test_evaluation_backends.py \
            tests/test_evaluation_gating.py \
            tests/test_paired_promotion.py
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'scripts/bootstrap.ps1',
            'scripts/bootstrap_runtime.ps1',
            'scripts/bootstrap_all_runtimes.ps1',
            'scripts/migrate_legacy_runtime.ps1',
            'scripts/smoke_windows.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $path"
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  torch-objective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: ROGS tensor tests
        run: |
          python -m pytest -q \
            tests/test_rogs.py \
            tests/test_objective.py \
            tests/test_mortal_hook.py

  mortal-unified-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Clone pinned canonical Mortal core
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/mortal-unified
          git -C /tmp/mortal-unified checkout 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2
      - name: Apply unified model Stage 1
        run: python scripts/patch_mortal_unified_stage1.py --root /tmp/mortal-unified
      - name: Compile unified model
        run: python -m py_compile /tmp/mortal-unified/mortal/model.py
      - name: Synthetic 3P and 4P model forward
        run: |
          mkdir -p /tmp/unified-stub/libriichi
          touch /tmp/unified-stub/libriichi/__init__.py
          cat > /tmp/unified-stub/libriichi/consts.py <<'PY'
          ACTION_SPACE = 46
          GRP_SIZE = 7
          def obs_shape(version):
              return (1012, 34)
          def oracle_obs_shape(version):
              return (217, 34)
          PY
          PYTHONPATH=/tmp/unified-stub:/tmp/mortal-unified/mortal python - <<'PY'
          import math
          import torch
          from model import Brain, DQN, GRP

          for players, actions, channels, grp_size in (
              (3, 44, 1010, 6),
              (4, 46, 1012, 7),
          ):
              brain = Brain(
                  version=4,
                  conv_channels=16,
                  num_blocks=1,
                  obs_channels=channels,
              ).eval()
              dqn = DQN(version=4, action_space=actions).eval()
              obs = torch.randn(2, channels, 34)
              mask = torch.ones(2, actions, dtype=torch.bool)
              with torch.inference_mode():
                  phi = brain(obs)
                  q = dqn(phi, mask)
              assert phi.shape == (2, 1024), phi.shape
              assert q.shape == (2, actions), q.shape
              assert torch.isfinite(q).all()

              grp = GRP(hidden_size=8, num_layers=1, num_players=players, input_size=grp_size)
              seq = [
                  torch.randn(3, grp_size, dtype=torch.float64),
                  torch.randn(5, grp_size, dtype=torch.float64),
              ]
              logits = grp(seq)
              assert logits.shape == (2, math.factorial(players)), logits.shape
              matrix = grp.calc_matrix(logits)
              assert matrix.shape == (2, players, players), matrix.shape
              assert torch.allclose(matrix.sum(-1), torch.ones(2, players, dtype=matrix.dtype))

          print('MORTAL_UNIFIED_MODEL_BOTH_MODES_OK')
          PY
      - name: Reject whitespace-damaged unified patch
        run: git -C /tmp/mortal-unified diff --check

  mortal-sanma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone Mortal Sanma upstream
        run: git clone --depth 1 https://github.com/Lawrencelea/Mortal_Sanma.git /tmp/mortal-sanma
      - name: Apply RTX 5080 and ROGS patch pipeline
        run: python scripts/patch_mortal_all.py --root /tmp/mortal-sanma
      - name: Compile patched trainer
        run: |
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/train.py
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/train_grp.py
          python -m py_compile /tmp/mortal-sanma/Mortal/mortal/model.py
      - name: Verify ROGS hook postconditions
        run: |
          grep -q "compute_mortal_rogs_batch" /tmp/mortal-sanma/Mortal/mortal/train.py
          grep -q "enable_behavior_cloning=not online" /tmp/mortal-sanma/Mortal/mortal/train.py
          grep -q "loss/rogs_total" /tmp/mortal-sanma/Mortal/mortal/train.py
          git -C /tmp/mortal-sanma diff --check

  mortal-yonma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone stock Mortal 4P upstream
        run: git clone --depth 1 https://github.com/Equim-chan/Mortal.git /tmp/mortal-4p
      - name: Apply RTX 5080 and ROGS patch pipeline
        run: python scripts/patch_mortal_4p.py --root /tmp/mortal-4p
      - name: Compile patched 4P trainer
        run: |
          python -m py_compile /tmp/mortal-4p/mortal/train.py
          python -m py_compile /tmp/mortal-4p/mortal/train_grp.py
          python -m py_compile /tmp/mortal-4p/mortal/model.py
      - name: Verify 4P ABI and ROGS postconditions
        run: |
          grep -q "compute_mortal_rogs_batch" /tmp/mortal-4p/mortal/train.py
          grep -q "enable_behavior_cloning=not online" /tmp/mortal-4p/mortal/train.py
          grep -q "loss/rogs_total" /tmp/mortal-4p/mortal/train.py
          grep -q "version = config\['control'\]\['version'\]" /tmp/mortal-4p/mortal/train.py
          git -C /tmp/mortal-4p diff --check

  mjx-sanma-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone pinned MJX
        run: |
          git clone --branch v0.1.0 --depth 1 https://github.com/mjx-project/mjx.git /tmp/mjx-sanma
          git -C /tmp/mjx-sanma submodule update --init --recursive
      - name: Verify pinned source
        run: |
          python scripts/audit_mjx_sanma.py \
            --root /tmp/mjx-sanma \
            --allow-blockers
      - name: Apply sanma stages 1-4
        run: python scripts/patch_mjx_sanma.py --root /tmp/mjx-sanma --through 4
      - name: Verify Stage 4 state/scoring postconditions
        run: |
          grep -q "RuleConfig rule_" /tmp/mjx-sanma/include/mjx/internal/state.h
          grep -q "rule_.rounds_per_wind" /tmp/mjx-sanma/include/mjx/internal/state.cpp
          grep -q "rule_.return_points" /tmp/mjx-sanma/include/mjx/internal/state.cpp
          grep -q "num_players - 2" /tmp/mjx-sanma/include/mjx/internal/win_score.cpp
          grep -q "rule.tsumo_loss = true" /tmp/mjx-sanma/include/mjx/internal/rule.h
      - name: Reject whitespace-damaged C++ patch
        run: git -C /tmp/mjx-sanma diff --check
      - name: Show residual four-player blockers
        run: |
          python scripts/audit_mjx_sanma.py \
            --root /tmp/mjx-sanma \
            --allow-changed \
            --allow-blockers
