# Minimal overlay merged into the actual Mortal train config.
# It intentionally contains no deployment paths, mode routing, or platform
# metadata; those remain in the Control Center config layer.

[rogs]
enabled = true
curriculum_steps = 1000000
# Oracle weight scheduling is retained in the objective interface, but the
# canonical trainer does not currently generate/pass oracle_q tensors.
oracle_final_weight = 0.05
bc_final_weight = 0.02
cql_final_weight = 0.05
regret_final_weight = 0.75

[objective]
value_weight = 1.0
regret_weight = 0.50
# Interface default only. Oracle/Search KL components are inactive unless a
# teacher tensor is explicitly supplied to compute_mortal_rogs_batch().
teacher_kl_weight = 0.30
entropy_weight = 0.002
bc_anchor_weight = 0.10
cql_anchor_weight = 0.25
regret_clip = 12.0
# Hedge helper/config exists, but the current canonical self-play behavior
# policy does not call hedge_policy(). Do not interpret this as active Hedge.
hedge_eta = 0.75
teacher_temperature = 1.5

# Optional dense global-reward shaping built from Mortal's existing GRP rank
# potential plus per-kyoku raw score deltas. Keep OFF until A/B evaluation.
[global_reward]
enabled = false
rank_utility_3p = [6.0, 0.0, -6.0]
rank_utility_4p = [6.0, 4.0, 2.0, 0.0]
score_delta_weight = 0.15
score_scale = 12000.0
