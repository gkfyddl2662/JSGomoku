# DESIGN / EXPERIMENT SPEC ONLY — not merged into canonical runtime training.
# Active training uses config/rogs_runtime.toml plus the mode-specific generated
# config. `enabled = true` below describes a proposed full hybrid experiment,
# not current Oracle/Search/Hedge/pMCP behavior.

[status]
design_only = true
active_runtime = false
canonical_runtime_config = "config/rogs_runtime.toml"

[compat]
# Historical Mortal checkpoint compatibility target. AkagiOT wire ABI is a
# separate contract; see docs/ABI_AND_WIRE_CONTRACTS.md.
model_version = 4
checkpoint_brain_key = "mortal"
checkpoint_dqn_key = "current_dqn"
require_akagi_smoke_test = true

[modes.3p]
players = 3
native_training_obs_channels = 1010
akagi_wire_obs_channels = 775
action_space = 44
checkpoint = "models/rogs_3p/mortal3p.pth"
best_checkpoint = "models/rogs_3p/best_mortal3p.pth"

[modes.4p]
players = 4
native_training_obs_channels = 1012
akagi_wire_obs_channels = 1012
action_space = 46
checkpoint = "models/rogs_4p/mortal.pth"
best_checkpoint = "models/rogs_4p/best_mortal.pth"

[student]
conv_channels = 192
num_blocks = 40
norm = "BN"

[rogs]
enabled = true
curriculum_steps = 1000000
oracle_final_weight = 0.05
bc_final_weight = 0.02
cql_final_weight = 0.05
regret_final_weight = 0.75

[objective]
value_weight = 1.0
regret_weight = 0.50
teacher_kl_weight = 0.30
entropy_weight = 0.002
bc_anchor_weight = 0.10
cql_anchor_weight = 0.25
regret_clip = 12.0
hedge_eta = 0.75
teacher_temperature = 1.5

[rating]
presets_file = "config/rating_presets.toml"
strategy = "curriculum"
target_profile = "mahjongsoul"
specialize_start = 0.70

[global_reward]
enabled = true
# Separate design-only gamma helper; canonical GRP already uses rank-potential differences.
potential_gamma = 1.0
use_rating_utility = true

[oracle]
enabled = true
# Design-only; canonical trainer currently passes no oracle_q.
start_weight = 0.50
final_weight = 0.05
decay_steps = 250000
hidden_info_dropout_start = 0.0
hidden_info_dropout_final = 1.0

[search_teacher]
enabled = true
# Design-only; canonical trainer currently passes no search_q.
determinizations = 64
rollouts_per_action = 4
max_candidate_actions = 8
sample_ratio = 0.10
focus_riichi = true
focus_final_round = true
focus_push_fold = true

[amortized_pmcp]
enabled = true
# Design-only; no active canonical pMCP teacher loop.
worlds_per_hand = 64
inner_steps = 4
inner_lr = 0.00002
sample_ratio = 0.025

[selfplay]
enabled = true
# Proposed league policy, not current population generator behavior.
league_size = 12
latest_probability = 0.45
champion_probability = 0.30
historical_probability = 0.25
snapshot_every_games = 2000

[gating.3p]
games = 12000
seat_rotation = true
paired_seeds = true
bootstrap_samples = 5000
confidence = 0.95
primary_metric = "rating_utility"
secondary_metric = "avg_rank"
max_last_rate_regression = 0.003

[gating.4p]
games = 16000
seat_rotation = true
paired_seeds = true
bootstrap_samples = 5000
confidence = 0.95
primary_metric = "rating_utility"
secondary_metric = "avg_rank"
max_last_rate_regression = 0.003

[deployment]
# Design compatibility target only. A future non-Mortal server backend may use a
# different checkpoint format while preserving the AkagiOT wire contract.
export_3p_name = "mortal3p.pth"
export_4p_name = "mortal.pth"
