# Evaluation backend policy for Mortal-ROGS.
# High-volume 4P uses MJX. 3P remains on the Akagi-compatible libriichi3p engine
# because neither upstream MJX nor gimite/mjai currently provides the sanma game
# loop required by this project.

[evaluation]
primary_4p = "mjx"
primary_3p = "libriichi3p"
reference_4p = "libriichi"
legacy_crosscheck_4p = "mjai"
seat_rotation = true
paired_seeds = true
rating_utility_gate = true

[mjx]
repository = "https://github.com/mjx-project/mjx"
# Upstream README currently warns that master may be broken. Pin the last public
# release for the first integration and change only after our compatibility tests pass.
ref = "v0.1.0"
runtime = "wsl2"
python = "3.11"
batch_size = 64
num_parallels = 16
# Reference conversion uses mjx-project/mjx_mjai_translater while the native
# in-process MJX->Mortal bridge is validated against it.
reference_translator = "https://github.com/mjx-project/mjx_mjai_translater"

[gate.4p]
backend = "mjx"
games = 12000
crosscheck_games = 256
crosscheck_backend = "libriichi"

[gate.3p]
backend = "libriichi3p"
games = 12000
crosscheck_games = 0

[statistics]
report_average_rank = true
report_place_rates = true
report_raw_score = true
report_rating_utility = true
report_agari_rate = true
report_houjuu_rate = true
report_riichi_rate = true
report_fuuro_rate = true
bootstrap_samples = 5000
